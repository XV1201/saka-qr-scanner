
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pemindai QR — Saka Bhayangkara</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    body {
      max-width: 560px;
      margin: 20px auto;
      padding: 16px;
      font-family: Arial, sans-serif;
      color: #17202b;
    }
    button {
      padding: 12px 16px;
      margin: 5px 5px 5px 0;
      border: 0;
      border-radius: 8px;
      background: #17365d;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
    button:disabled { opacity: .5; }
    #reader { width: 100%; margin-top: 16px; }
    #status {
      padding: 12px;
      border-radius: 8px;
      background: #f1f4f8;
      line-height: 1.5;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <h2>Pemindai QR Saka Bhayangkara</h2>
  <p>Gunakan halaman ini melalui tombol pemindai di aplikasi admin.</p>

  <button id="start">Mulai Kamera</button>
  <button id="next" disabled>Scan Berikutnya</button>
  <button id="stop" disabled>Hentikan Kamera</button>

  <div id="reader"></div>
  <p id="status">Menghubungkan ke aplikasi admin…</p>

  <script>
    'use strict';

    const ADMIN_ORIGIN_ALLOWED = origin =>
      origin === 'https://script.google.com' ||
      origin.endsWith('.script.googleusercontent.com');

    let adminOrigin = null;
    let scanner = null;
    let running = false;
    let waitingForResult = false;
    let scanCounter = 0;
    let currentScanId = null;

    const statusEl = document.getElementById('status');
    const startBtn = document.getElementById('start');
    const nextBtn = document.getElementById('next');
    const stopBtn = document.getElementById('stop');

    function setStatus(text) {
      statusEl.textContent = text;
    }

    function sendReady() {
      if (window.opener && !window.opener.closed) {
        // Pesan ini hanya meminta inisialisasi; tidak membawa rahasia.
        window.opener.postMessage(
          { type: 'SAKA_SCANNER_READY' },
          '*'
        );
      }
    }

window.addEventListener('message', async event => {
  console.log('[SCANNER] Pesan diterima:', {
    origin: event.origin,
    type: event.data?.type,
    hasOpener: !!window.opener,
    fromOpener: event.source === window.opener
  });

  if (!window.opener || event.source !== window.opener) return;

      if (event.data &&
          event.data.type === 'SAKA_SCANNER_INIT') {
        if (!ADMIN_ORIGIN_ALLOWED(event.origin)) {
          setStatus('Origin aplikasi admin tidak dikenali. Tutup halaman ini dan buka kembali dari aplikasi admin.');
          return;
        }

        adminOrigin = event.origin;
        setStatus('Terhubung ke aplikasi admin. Kamu dapat mengaktifkan kamera.');
        startBtn.disabled = false;
        return;
      }

      // Semua pesan berikut harus datang dari origin admin yang
      // sudah diverifikasi saat proses inisialisasi.
      if (!adminOrigin || event.origin !== adminOrigin) return;

      if (event.data &&
          event.data.type === 'SAKA_SCAN_RESULT' &&
          event.data.scanId === currentScanId) {
        waitingForResult = false;
        currentScanId = null;

        const result = event.data.result || {};
        setStatus(result.message || 'Pemindaian selesai.');

        if (running && scanner) {
          nextBtn.disabled = false;
          nextBtn.textContent = 'Scan Berikutnya';
        }
      }

      if (event.data &&
          event.data.type === 'SAKA_SCANNER_STOP') {
        await stopCamera();
      }
    });

    async function startCamera() {
      if (!adminOrigin) {
        setStatus('Belum terhubung ke aplikasi admin. Buka halaman ini dari tombol pemindai admin.');
        return;
      }

      if (running) {
        if (scanner && !waitingForResult) {
          try {
            await scanner.resume();
            setStatus('Kamera aktif. Arahkan ke QR anggota berikutnya.');
          } catch (err) {
            setStatus('Tidak dapat melanjutkan kamera: ' + String(err));
          }
        }
        return;
      }

      if (typeof Html5Qrcode === 'undefined') {
        setStatus('Library QR gagal dimuat. Periksa koneksi internet.');
        return;
      }

      startBtn.disabled = true;

      try {
        scanner = new Html5Qrcode('reader');

        await scanner.start(
          { facingMode: 'environment' },
          {
            fps: 10,
            qrbox: { width: 230, height: 230 },
            aspectRatio: 1
          },
          decodedText => {
            if (waitingForResult || !adminOrigin) return;

            waitingForResult = true;
            currentScanId = 'scan-' + (++scanCounter);

            // Hentikan pembacaan berulang selama server memproses QR.
            scanner.pause(true);
            nextBtn.disabled = true;

            window.opener.postMessage({
              type: 'SAKA_QR_SCAN',
              scanId: currentScanId,
              text: decodedText
            }, adminOrigin);

            setStatus('QR dikirim ke admin. Menunggu hasil validasi server…');
          }
        );

        running = true;
        stopBtn.disabled = false;
        nextBtn.disabled = true;
        setStatus('Kamera aktif. Arahkan ke QR anggota.');
      } catch (err) {
        scanner = null;
        running = false;
        startBtn.disabled = false;
        setStatus(
          'Kamera gagal dibuka: ' + String(err) +
          '\nPeriksa izin kamera browser dan pastikan halaman menggunakan HTTPS.'
        );
      }
    }

    async function nextScan() {
      if (!running || !scanner || waitingForResult) return;

      try {
        await scanner.resume();
        nextBtn.disabled = true;
        setStatus('Siap memindai QR berikutnya.');
      } catch (err) {
        setStatus('Gagal melanjutkan kamera: ' + String(err));
      }
    }

    async function stopCamera() {
      if (scanner && running) {
        try {
          await scanner.stop();
          scanner.clear();
        } catch (err) {
          // Tetap reset status lokal jika kamera sudah berhenti.
        }
      }

      scanner = null;
      running = false;
      waitingForResult = false;
      currentScanId = null;

      startBtn.disabled = false;
      nextBtn.disabled = true;
      stopBtn.disabled = true;
      setStatus('Kamera dihentikan.');
    }

    startBtn.addEventListener('click', startCamera);
    nextBtn.addEventListener('click', nextScan);
    stopBtn.addEventListener('click', stopCamera);

    startBtn.disabled = true;
    sendReady();
  </script>
</body>
</html>
