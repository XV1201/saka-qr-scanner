
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pemindai QR Saka Bhayangkara</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 560px;
      margin: 24px auto;
      padding: 16px;
      color: #17202b;
    }
    button {
      padding: 12px 16px;
      margin: 5px 5px 5px 0;
      border: 0;
      border-radius: 8px;
      background: #17365d;
      color: white;
      font-weight: bold;
    }
    #reader { width: 100%; margin-top: 16px; }
    #status {
      padding: 12px;
      background: #f1f4f8;
      border-radius: 8px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
  </style>
</head>
<body>
  <h2>Pemindai QR Saka Bhayangkara</h2>
  <p>Halaman ini harus dibuka dari tombol pemindai pada aplikasi admin.</p>
  <button id="start">Mulai kamera</button>
  <button id="stop">Hentikan kamera</button>
  <div id="reader"></div>
  <p id="status">Menunggu kamera diaktifkan.</p>

  <script>
    // GANTI dengan origin aplikasi admin yang benar.
    const ADMIN_ORIGIN = "https://script.google.com";

    let scanner = null;
    let running = false;
    let sending = false;

    const statusEl = document.getElementById("status");

    function status(message) {
      statusEl.textContent = message;
    }

    document.getElementById("start").onclick = async () => {
      if (!window.opener || window.opener.closed) {
        status("Buka pemindai melalui tombol di aplikasi admin.");
        return;
      }
      if (running) return;

      if (typeof Html5Qrcode === "undefined") {
        status("Library QR gagal dimuat. Periksa koneksi internet.");
        return;
      }

      try {
        scanner = new Html5Qrcode("reader");
        await scanner.start(
          { facingMode: "environment" },
          { fps: 10, qrbox: { width: 230, height: 230 } },
          async (decodedText) => {
            if (sending) return;
            sending = true;

            try {
              // QR hanya diteruskan ke jendela admin pembuka.
              window.opener.postMessage({
                type: "SAKA_QR_SCAN",
                text: decodedText
              }, ADMIN_ORIGIN);

              status("QR terbaca dan diteruskan ke aplikasi admin.");
              await scanner.pause(true);
              document.getElementById("start").textContent = "Scan berikutnya";
            } catch (err) {
              status("Gagal meneruskan QR: " + String(err));
            }
          }
        );

        running = true;
        status("Kamera aktif. Arahkan kamera ke QR anggota.");
      } catch (err) {
        status("Kamera gagal dibuka: " + String(err));
      }
    };

    document.getElementById("stop").onclick = async () => {
      if (scanner && running) {
        try {
          await scanner.stop();
          scanner.clear();
        } catch (err) {
          status("Kamera dihentikan atau sudah tidak aktif.");
        }
      }
      scanner = null;
      running = false;
      sending = false;
      document.getElementById("start").textContent = "Mulai kamera";
      status("Kamera dihentikan.");
    };
  </script>
</body>
</html>
